# ============================================================
# JARVIS CI/CD — GitHub Actions
#
# Stages:
#   1. lint      — ruff + mypy on backend
#   2. test      — pytest (skipped for MVP; hook it up when tests exist)
#   3. build-apk — React Native release APK via Gradle
#   4. deploy    — rsync to VPS + docker compose up
#
# Required GitHub Secrets:
#   VPS_HOST            e.g. 200.141.2.221
#   VPS_USER            e.g. root
#   VPS_SSH_KEY         private key (no passphrase) with VPS_USER access
#   GOOGLE_API_KEY      Gemini key
#   POSTGRES_PASSWORD   DB password
# ============================================================

name: JARVIS Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────
  lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install ruff mypy -r backend/requirements.txt
      - name: ruff check
        run: ruff check backend/
      - name: mypy
        run: mypy backend/app --ignore-missing-imports --no-strict-optional

  # ──────────────────────────────────────────────────────────
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS deps
        working-directory: frontend
        run: npm ci

      - name: Build release APK
        working-directory: frontend
        run: ./android/gradlew -p android assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  # ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [lint]           # APK build is slow; deploy backend without waiting
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Write .env on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cat > /root/jarvis/.env" << 'ENVEOF'
          POSTGRES_USER=jarvis
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=jarvis
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL=gemini-2.5-flash
          USE_MOCK_DATA=true
          SECRET_KEY=${{ secrets.SECRET_KEY || 'change-me-generate-with-openssl-rand-hex-32' }}
          DEBUG=false
          ENVEOF

      - name: Sync code to VPS
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='frontend/node_modules/' \
            --exclude='frontend/android/.gradle/' \
            --exclude='.env' \
            --exclude='dist/' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/jarvis/

      - name: Deploy containers
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd /root/jarvis &&
            docker compose pull --quiet 2>/dev/null || true &&
            docker compose up -d --build --remove-orphans &&
            echo 'Waiting for backend health...' &&
            for i in \$(seq 1 30); do
              docker compose exec -T backend python3 -c \
                'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' \
                2>/dev/null && echo 'Backend healthy' && break || sleep 3
            done
          "

      - name: Deploy APK (if build succeeded)
        needs: build-apk
        continue-on-error: true
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /var/www/jarvis"
          # Download APK artifact uploaded in build-apk job
          # (handled by artifact download in a real pipeline; simplified here)
          echo "APK deploy: copy from build-apk artifact to /var/www/jarvis/app.apk on VPS"
