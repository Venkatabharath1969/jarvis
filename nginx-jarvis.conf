# nginx-jarvis.conf
# Drop this file into /etc/nginx/conf.d/ or include it from your main nginx.conf.
# This block assumes the JARVIS backend runs on 127.0.0.1:8000 on the same host.
# Adjust the server_name directive if you want a dedicated vhost.

server {
    listen 443 ssl;
    server_name utilsnow.com;

    # SSL certificates managed separately (e.g. Certbot / Let's Encrypt)
    # ssl_certificate     /etc/letsencrypt/live/utilsnow.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/utilsnow.com/privkey.pem;

    # ----------------------------------------------------------------
    # JARVIS REST API
    # Requests to /jarvis/api/ are proxied to the FastAPI backend.
    # The trailing slash on proxy_pass strips the /jarvis/api prefix.
    # ----------------------------------------------------------------
    location /jarvis/api/ {
        proxy_pass         http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /jarvis/test {
        proxy_pass         http://127.0.0.1:8001/test;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------------
    # JARVIS WebSocket endpoint
    # Used for real-time voice streaming between the mobile app and backend.
    # ----------------------------------------------------------------
    location /jarvis/ws {
        proxy_pass             http://127.0.0.1:8001/ws;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_set_header       X-Real-IP  $remote_addr;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
    }

    # ----------------------------------------------------------------
    # JARVIS APK download
    # Place the signed APK at /var/www/jarvis/app.apk on the server.
    # The Content-Disposition header triggers a download on Android.
    # Cache-Control: no-cache ensures users always get the latest build.
    # ----------------------------------------------------------------
    location = /jarvis/app.apk {
        alias              /var/www/jarvis/app.apk;
        default_type       application/vnd.android.package-archive;
        add_header         Content-Disposition 'attachment; filename="jarvis.apk"';
        add_header         Cache-Control "no-cache, no-store, must-revalidate";
        add_header         Pragma "no-cache";
        add_header         Expires "0";
    }

    # ----------------------------------------------------------------
    # JARVIS presentation page
    # A single HTML file served at this path.
    # Place the file at /var/www/jarvis/jarvis-presentation.html.
    # ----------------------------------------------------------------
    location = /jarvis/presentation {
        alias /var/www/jarvis/jarvis-presentation.html;
    }
}
