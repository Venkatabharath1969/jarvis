<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS — Browser Test UI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0A0E1A;
    color: #E0E6F0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid #1E2A3A;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 {
    font-size: 18px;
    letter-spacing: 6px;
    color: #00ADEF;
    font-weight: 800;
  }
  header span {
    font-size: 11px;
    color: #6B7A99;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  #status-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #444;
    margin-left: auto;
    flex-shrink: 0;
    transition: background 0.3s;
  }
  #status-dot.connected { background: #00ADEF; box-shadow: 0 0 8px #00ADEF88; }
  #status-dot.disconnected { background: #FF4466; }
  #status-label { font-size: 11px; color: #6B7A99; letter-spacing: 1px; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 72%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(4px);} to { opacity:1; transform:none;} }
  .msg.user {
    align-self: flex-end;
    background: #0D2137;
    border: 1px solid #00ADEF44;
    color: #C8D8EE;
  }
  .msg.assistant {
    align-self: flex-start;
    background: #141E2E;
    border: 1px solid #1E2A3A;
    color: #E0E6F0;
  }
  .msg.error {
    align-self: flex-start;
    background: #2A0D14;
    border: 1px solid #FF4466;
    color: #FF9999;
  }
  .msg.system {
    align-self: center;
    background: transparent;
    border: none;
    color: #4A5A72;
    font-size: 12px;
  }
  .msg-label {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 4px;
    opacity: 0.6;
  }

  #thinking {
    display: none;
    align-self: flex-start;
    padding: 10px 14px;
    background: #141E2E;
    border: 1px solid #1E2A3A;
    border-radius: 12px;
    color: #6B7A99;
    font-size: 13px;
    letter-spacing: 1px;
  }
  #thinking.active { display: block; }
  .dot-anim span {
    display: inline-block;
    animation: bounce 1.2s infinite;
  }
  .dot-anim span:nth-child(2) { animation-delay: 0.2s; }
  .dot-anim span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-5px)} }

  footer {
    padding: 14px 24px;
    border-top: 1px solid #1E2A3A;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  #input {
    flex: 1;
    background: #141E2E;
    border: 1px solid #1E2A3A;
    border-radius: 8px;
    color: #E0E6F0;
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  #input:focus { border-color: #00ADEF55; }
  #input::placeholder { color: #3A4A5F; }
  #send-btn {
    background: #00ADEF;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: opacity 0.2s;
  }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .quick-queries {
    padding: 0 24px 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .quick-btn {
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 20px;
    border: 1px solid #1E3A55;
    background: #0D2137;
    color: #6BA8CC;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    letter-spacing: 0.3px;
  }
  .quick-btn:hover { background: #1A3A5A; border-color: #00ADEF88; color: #00ADEF; }

  #ws-url-row {
    padding: 8px 24px;
    border-bottom: 1px solid #1E2A3A;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  #ws-url-row label { font-size: 11px; color: #4A5A72; letter-spacing: 1px; flex-shrink: 0; }
  #ws-url {
    flex: 1;
    background: #141E2E;
    border: 1px solid #1E2A3A;
    border-radius: 6px;
    color: #8BA8C8;
    font-size: 12px;
    padding: 5px 10px;
    outline: none;
    font-family: monospace;
  }
  #connect-btn {
    background: transparent;
    border: 1px solid #00ADEF;
    color: #00ADEF;
    border-radius: 6px;
    padding: 5px 14px;
    font-size: 12px;
    cursor: pointer;
  }
  #connect-btn:hover { background: #00ADEF22; }
</style>
</head>
<body>

<header>
  <h1>J A R V I S</h1>
  <span>Executive AI Assistant — Browser Test</span>
  <div id="status-dot" class="disconnected"></div>
  <span id="status-label">Disconnected</span>
</header>

<div id="ws-url-row">
  <label>WS:</label>
  <input id="ws-url" type="text" value="" placeholder="ws://localhost:8001/ws" />
  <button id="connect-btn" onclick="reconnect()">Connect</button>
</div>

<div id="messages">
  <div class="msg system">Type a query below or tap a quick button to test JARVIS.</div>
</div>

<div id="thinking" class="dot-anim">
  Processing <span>•</span><span>•</span><span>•</span>
</div>

<div class="quick-queries">
  <button class="quick-btn" onclick="sendQuick(this)">What meetings do I have today?</button>
  <button class="quick-btn" onclick="sendQuick(this)">What's on my schedule this week?</button>
  <button class="quick-btn" onclick="sendQuick(this)">Am I free tomorrow at 2pm?</button>
  <button class="quick-btn" onclick="sendQuick(this)">What are my overdue action items?</button>
  <button class="quick-btn" onclick="sendQuick(this)">Tell me about the 1:1 with Bharath.</button>
  <button class="quick-btn" onclick="sendQuick(this)">Who is Klaus Weber?</button>
</div>

<footer>
  <input id="input" type="text" placeholder="Ask JARVIS anything…" autocomplete="off" />
  <button id="send-btn" onclick="sendMsg()" disabled>Send</button>
</footer>

<script>
  let ws = null;
  let waitingForResponse = false;

  const msgBox = document.getElementById('messages');
  const thinking = document.getElementById('thinking');
  const sendBtn = document.getElementById('send-btn');
  const input = document.getElementById('input');
  const dot = document.getElementById('status-dot');
  const statusLabel = document.getElementById('status-label');
  const wsUrlInput = document.getElementById('ws-url');

  // Derive WS URL from page origin
  const defaultWsUrl = location.protocol === 'https:'
    ? 'wss://' + location.host + '/ws'
    : 'ws://' + location.host + '/ws';
  wsUrlInput.value = defaultWsUrl;

  function setStatus(s) {
    dot.className = s;
    statusLabel.textContent = s.charAt(0).toUpperCase() + s.slice(1);
    sendBtn.disabled = (s !== 'connected');
  }

  function addMsg(role, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    if (role !== 'system') {
      const lbl = document.createElement('div');
      lbl.className = 'msg-label';
      lbl.textContent = role === 'user' ? 'You' : (role === 'error' ? 'Error' : 'JARVIS');
      d.appendChild(lbl);
    }
    const t = document.createElement('div');
    t.textContent = text;
    d.appendChild(t);
    msgBox.appendChild(d);
    msgBox.scrollTop = msgBox.scrollHeight;
  }

  function connect(url) {
    if (ws) { ws.onclose = null; ws.close(); ws = null; }
    setStatus('connecting');
    try {
      ws = new WebSocket(url);
    } catch(e) {
      setStatus('disconnected');
      addMsg('error', 'Invalid WebSocket URL: ' + e.message);
      return;
    }
    ws.onopen = () => {
      setStatus('connected');
      addMsg('system', 'Connected to JARVIS backend.');
    };
    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      thinking.classList.remove('active');
      waitingForResponse = false;
      if (data.type === 'response' && data.text) {
        addMsg('assistant', data.text);
        if ('speechSynthesis' in window && data.text) {
          const utt = new SpeechSynthesisUtterance(data.text.slice(0, 300));
          utt.rate = 0.95; utt.pitch = 1.0;
          speechSynthesis.speak(utt);
        }
      } else if (data.type === 'error') {
        addMsg('error', data.text || data.error || 'Unknown error');
      }
    };
    ws.onerror = () => {};
    ws.onclose = () => {
      setStatus('disconnected');
      thinking.classList.remove('active');
      waitingForResponse = false;
      setTimeout(() => connect(wsUrlInput.value), 4000);
    };
  }

  function reconnect() {
    connect(wsUrlInput.value.trim() || defaultWsUrl);
  }

  function sendMsg() {
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    addMsg('user', text);
    input.value = '';
    thinking.classList.add('active');
    waitingForResponse = true;
    ws.send(JSON.stringify({ type: 'query', text }));
    msgBox.scrollTop = msgBox.scrollHeight;
    // 30s local timeout
    setTimeout(() => {
      if (waitingForResponse) {
        thinking.classList.remove('active');
        waitingForResponse = false;
        addMsg('error', 'Request timed out after 30 seconds. The backend may be slow or the Gemini quota exhausted.');
      }
    }, 30000);
  }

  function sendQuick(btn) { input.value = btn.textContent; sendMsg(); }

  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMsg(); });

  connect(defaultWsUrl);
</script>
</body>
</html>
